[package]
name = "sgw-sniper"
version = "0.1.0"
edition = "2021"
[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json","rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[lints.rust]
warnings = "warn"
[lints.clippy]
pedantic = "warn"
nursery = "allow"
