name: CI
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ts/package-lock.json }
      - run: npm ci
        working-directory: ts
      - run: npm run typecheck
        working-directory: ts
      - run: npm run lint
        working-directory: ts
      - run: npm run format:check
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: python3 -c "import sqlite3; con=sqlite3.connect(':memory:'); con.executescript(open('schema.sql').read()); print('schema ok')"
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rs/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rs/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path rs/Cargo.toml || echo "no tests yet"
      - run: cargo build --manifest-path rs/Cargo.toml --release
  docker:
    runs-on: ubuntu-latest
    needs: [ts, rs]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
